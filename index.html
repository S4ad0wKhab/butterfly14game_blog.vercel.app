<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butterfly'14 Game Development Blog</title>
    
    <!-- Google Fonts: Noto Sans & Noto Sans Thai (รองรับหลายภาษาทั่วโลก) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700&family=Noto+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Markdown Parser (Marked.js) & Sanitizer (DOMPurify สำหรับความปลอดภัยเมื่อฝัง HTML) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
</head>
<body>

    <header class="blog-header">
        <!-- โลโก้ / หัวข้อหลัก -->
        <h1 class="blog-title">Butterfly'14 Game Development Blog</h1>
    </header>

    <main class="container">
        <!-- พื้นที่แสดงโพสต์ -->
        <section id="posts-container" class="posts-container">
            <!-- โพสต์จะถูกโหลดมาแสดงที่นี่ผ่าน JavaScript -->
        </section>

        <!-- ปุ่มโหลดโพสต์เพิ่มเติม -->
        <div class="load-more-container">
            <button id="load-more-btn" class="btn-load-more" onclick="loadMorePosts()">โหลดโพสต์เพิ่มเติม</button>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
